<svg xmlns="http://www.w3.org/2000/svg" width="600" height="710" viewBox="0 0 600 710" role="img" aria-labelledby="title desc">
  <title id="title">GIF Cinema. Small takes. Real stories.</title>
  <desc id="desc">Original static identity artwork for narrow screens. Cream and orange lettering above silver orbital ribbons. This is graphic design, not a generated GIF example.</desc>
