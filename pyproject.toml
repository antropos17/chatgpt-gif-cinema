[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gif-cinema"
version = "0.5.0"
description = "Direct short GIF takes into animated stories: plan scenes, review cuts, add titles, and export MP4 or GIF."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]
license = "LicenseRef-GifCinema-Evaluation-1.0"
authors = [{name = "GIF Cinema Contributors"}]
keywords = ["openai", "gif", "animation", "film", "codex", "skill"]

[project.optional-dependencies]
filmqa = ["Pillow>=10"]

[project.scripts]
gif-cinema = "gif_cinema.cli:main"

[tool.setuptools.packages.find]
include = ["gif_cinema*"]
