[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gif-cinema"
version = "0.5.0"
description = "Direct short GIF takes into animated stories: plan scenes, review cuts, add titles, and export MP4 or GIF."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1"]
license = "LicenseRef-GifCinema-Evaluation-1.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md", "gif_cinema/assets/fonts/OFL.txt"]
authors = [{name = "GIF Cinema Contributors"}]
keywords = ["openai", "gif", "animation", "film", "codex", "skill"]

[project.optional-dependencies]
filmqa = ["Pillow>=10.1"]

[project.scripts]
gif-cinema = "gif_cinema.cli:main"

[tool.setuptools.packages.find]
include = ["gif_cinema*"]

[tool.setuptools.package-data]
gif_cinema = ["assets/fonts/*.ttf", "assets/fonts/*.json", "assets/fonts/OFL.txt"]
