[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gif-cinema"
version = "0.5.0"
description = "Turn prompts into GPT Image 2.6 GIFs, then assemble short films."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1"]
license = "LicenseRef-GifCinema-Evaluation-1.0"
authors = [{name = "GIF Cinema Contributors"}]
keywords = ["openai", "gif", "animation", "film", "codex", "skill"]

[project.optional-dependencies]
filmqa = ["Pillow>=10.1"]

[project.scripts]
gif-cinema = "gif_cinema.cli:main"

[tool.setuptools.packages.find]
include = ["gif_cinema*"]
