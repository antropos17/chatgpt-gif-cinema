name: Publish Verified GIF Demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-demo.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve successful authenticated render
        uses: actions/download-artifact@v4
        with:
          name: chatgpt-gif-cinema-first-live-render
          run-id: 41978897155
          github-token: ${{ github.token }}
          path: docs/assets
      - name: Inspect and encode MP4
        run: |
          python -m pip install -e '.[filmqa]'
          mkdir -p docs/assets
          gif-cinema inspect docs/assets/live-test.gif
          gif-cinema film docs/assets/live-test.gif -o docs/assets/first-live-film.mp4 --width 512 --height 512 --fps 24
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,duration -of default=noprint_wrappers=1 docs/assets/first-live-film.mp4
          mv docs/assets/live-test.gif docs/assets/first-live-render.gif
          mv docs/assets/live-test.json docs/assets/first-live-render.json
          mv docs/assets/live-test-inspect.json docs/assets/first-live-render-inspect.json
      - name: Update README with genuine demo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          txt=p.read_text(encoding='utf8')
          txt=txt.replace('> Status: Offline checks passed. Live OpenAI GIF generation has not been verified on this account.', '> Status: **First authenticated OpenAI GIF generated and verified** on November 5, 2026; automated multi-shot movie creation still experimental.')
          txt=txt.replace('A live API call is still pending.', 'First real API render confirmed by GitHub Actions [run #41978897155](https://github.com/antropos17/chatgpt-gif-cinema/actions/runs/41978897155).')
          block='''## First verified GPT Image 2.6 GIF (Nov 5, 2026)

          ![A paper-cut astronaut waving once on the Moon, generated with GPT Image 2.6 Flare](docs/assets/first-live-render.gif)

          **Real API output:** 512×512, 9 frames, 1.8 seconds. [Original GIF](docs/assets/first-live-render.gif) · [MP4 export](docs/assets/first-live-film.mp4) · [API run](https://github.com/antropos17/chatgpt-gif-cinema/actions/runs/41978897155).

          The animation was generated by a paid API request, not a mock. MP4 is a one-shot technical export, not a multi-shot short film.

          '''
          if '## First verified GPT Image 2.6 GIF' not in txt:
              txt=txt.replace('## Quickstart',block+'## Quickstart')
          p.write_text(txt,encoding='utf8')
          PY
      - name: Commit demo files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/first-live-render.gif docs/assets/first-live-render.json docs/assets/first-live-render-inspect.json docs/assets/first-live-film.mp4 README.md
          if ! git diff --cached --quiet; then git commit -m 'docs: publish first authenticated GPT Image GIF and MP4 demo'; git push; fi
