name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.10"}
          - {os: ubuntu-24.04, python: "3.12", artifact: true}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: windows-2025, python: "3.12"}
          - {os: macos-15, python: "3.12"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ensure FFmpeg tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            case "$RUNNER_OS" in
              Linux)
                sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
                sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y ffmpeg
                ;;
              macOS)
                brew install ffmpeg
                ;;
              Windows)
                choco install ffmpeg -y --no-progress
                echo "C:\\ProgramData\\chocolatey\\bin" >> "$GITHUB_PATH"
                ;;
            esac
          fi
      - run: ffmpeg -version && ffprobe -version
      - run: python -m pip install -e ".[filmqa]"
      - run: python -m compileall -q gif_cinema
      - run: python -m gif_cinema doctor
      - run: python -m unittest discover -s tests -v
      - run: python -m gif_cinema --help
      - name: Verify script planning and zero-call assembly
        run: |
          python -m gif_cinema render examples/film.json --dry-run
          python -m gif_cinema render examples/film.json --execute --max-api-calls 0 --out output/ci-story
          python -m gif_cinema render examples/film.json --execute --max-api-calls 0 --out output/ci-story
      - if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-script-film
          path: output/ci-story/
          retention-days: 7
          if-no-files-found: error

      - name: Package the installable skill
        if: matrix.artifact
        run: |
          python tools/package_skill.py --out output/gif-cinema-skill-0.2.1.zip
          python tools/package_skill.py --out output/gif-cinema-skill-repeat.zip
          python - <<'PYCODE'
          import hashlib
          from pathlib import Path
          first = Path('output/gif-cinema-skill-0.2.1.zip')
          assert first.read_bytes() == Path('output/gif-cinema-skill-repeat.zip').read_bytes()
          Path('output/gif-cinema-skill-0.2.1.sha256').write_text(
              hashlib.sha256(first.read_bytes()).hexdigest() + '  ' + first.name + '\n', encoding='utf-8')
          PYCODE
      - if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: gif-cinema-skill-0.2.1
          path: |
            output/gif-cinema-skill-0.2.1.zip
            output/gif-cinema-skill-0.2.1.sha256
          retention-days: 14
          if-no-files-found: error
