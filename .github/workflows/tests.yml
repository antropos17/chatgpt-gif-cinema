name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[filmqa]"
      - run: python -m compileall -q gif_cinema
      - run: python -m unittest discover -s tests -v
      - run: python -m gif_cinema --help
