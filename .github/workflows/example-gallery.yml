name: Example gallery portability
on:
  push:
    paths:
      - '.github/workflows/example-gallery.yml'
      - 'tools/inspect_example_sources.py'
      - 'tests/test_example_gallery.py'
      - 'gif_cinema/cli.py'
      - 'examples/asset-catalog.json'
      - 'docs/assets/example-gallery/**'
      - '.agents/skills/gif-cinema/assets/example/**'
  pull_request:
    paths:
      - '.github/workflows/example-gallery.yml'
      - 'tools/inspect_example_sources.py'
      - 'tests/test_example_gallery.py'
      - 'gif_cinema/cli.py'
      - 'examples/asset-catalog.json'
      - 'docs/assets/example-gallery/**'
      - '.agents/skills/gif-cinema/assets/example/**'
permissions:
  contents: read
jobs:
  windows-inspector:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_example_gallery.py -v
      - run: python tools/inspect_example_sources.py --check
